name: CI

# CI de l'app Forge « Rayon d'impact » : types, tests unitaires, sanity docs et
# tests des gardes. Le check publié s'appelle `ci` : il est exigé par le
# ruleset de `main` et par la file Mergify, comme `ci-budget` et `couche0`.
#
# Budget : 5 minutes maximum (règle CI du 24 octobre). Les runners sont
# persistants : `node_modules` est conservé d'un run à l'autre, l'installation
# n'a lieu que si `package-lock.json` a changé. Le cache npm est partagé.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Le runner GitHub-hosted est jetable : le checkout est propre, mais
      # `node_modules` doit être installé à chaque run. Le cache npm de
      # `setup-node` garde le téléchargement, pas l'installation.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: |
          git clean -ffdx -e /node_modules -e /dist -e /build
          # Un run précédent peut avoir modifié un fichier SUIVI (`npm install`
          # réécrit `package-lock.json`) : sans cette restauration, l'empreinte
          # comparée au marqueur n'est plus celle du commit et la CI réinstalle
          # à chaque run — donc dépasse le budget de 5 minutes.
          git checkout -- .

      # Détecté AVANT l'installation : `ci` est aussi le garde des 5 min, et
      # un run docs-only ne doit pas payer un `npm ci` de 2 min. `tsc`/`vitest`
      # ne tournent que si du TypeScript (ou le lockfile) a changé.
      - name: Le TypeScript ou les dependances ont-ils change ?
        id: ts
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          git fetch -q --depth=50 origin "$BASE" 2>/dev/null || true
          # Le defaut est `changed=true` : si le diff est illisible (BASE non
          # resolu), les types sont COMPTES comme changes, on n'en saute jamais.
          fichiers="$(git diff --name-only "$BASE" HEAD 2>/dev/null)"
          if [ -z "$fichiers" ]; then
            changed=true
          elif printf '%s\n' "$fichiers" \
               | grep -qE '\.(ts|tsx)$|package(-lock)?\.json$|tsconfig\.json$|vitest\.config\.ts$'; then
            changed=true
          else
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "diag: typescript_modifie=$changed fichiers=$(printf '%s' "$fichiers" | wc -l)"

      # Installation : `npm ci` à partir du lockfile (reproductible). Le cache
      # npm de `setup-node` garde les téléchargements, donc seule l'installation
      # est refaite. Nécessaire sur un runner jetable : sans elle, `npx tsc` ne
      # trouve pas TypeScript et le job échoue en 8 s (régression #33).
      - name: Dependances (installation)
        if: steps.ts.outputs.changed == 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Types (tsc --noEmit)
        if: steps.ts.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Tests unitaires (vitest)
        if: steps.ts.outputs.changed == 'true'
        run: npx vitest run --passWithNoTests

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import pathlib
          racines = [pathlib.Path(".")]
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for racine in racines:
              for f in sorted(racine.rglob("*")):
                  chemin = f.as_posix()
                  # node_modules et sorties de build : jamais des documents du depot.
                  if any(d in chemin for d in (".git/", "node_modules/", "/dist/", "/build/")):
                      continue
                  if f.suffix.lower() not in exts:
                      continue
                  total += 1
                  try:
                      contenu = f.read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      illisibles.append(f.as_posix())
                      continue
                  if not contenu.strip():
                      vides.append(f.as_posix())
          print("%d doc(s) controle(s)" % total)
          for f in illisibles:
                  print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
                  print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Vu en reel : l'agent de conflit a pousse une reconciliation partielle
      # (marqueur `>>>>>>>` + fichier tronque) sans qu'aucune porte ne le voie —
      # la porte de compilation ne s'applique qu'au code. Ce controle est donc
      # transversal : aucun fichier suivi ne doit contenir de marqueur de conflit.
      - name: Aucun marqueur de conflit dans les fichiers suivis
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======$)' -- . ':!*.md.orig'; then
            echo "::error::marqueur(s) de conflit trouves dans des fichiers suivis"
            exit 1
          fi
          echo "aucun marqueur de conflit"

      # Regles du projet : fichiers < 500 lignes, fonctions < 50 lignes.
      # Garde automatisee : jusque-la le controle etait fait a la main.
      - name: Tailles des fichiers et des fonctions
        run: python3 scripts/check-limits.py -q

      # Les gardes et les scripts Python du depot se testent eux-memes :
      # couche0 + agents fireworks, garde des tailles, harnais de recette -
      # stdlib, quelques secondes, aucun reseau.
      - name: Tests Python (gardes CI, garde des tailles, harnais)
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
          python3 -m unittest discover -s tests/scripts
