name: CI

# CI de l'app Forge « Rayon d'impact » : types, tests unitaires, sanity docs et
# tests des gardes. Le check publié s'appelle `ci` : il est exigé par le
# ruleset de `main` et par la file Mergify, comme `ci-budget` et `couche0`.
#
# Budget : 5 minutes maximum (règle CI du 24 octobre). Les runners sont
# persistants : `node_modules` est conservé d'un run à l'autre, l'installation
# n'a lieu que si `package-lock.json` a changé. Le cache npm est partagé.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, rayon-impact-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : on garde `node_modules` (l'app
      # TypeScript), on jette le reste. `git clean -ffdx` sans `-e` effacerait
      # les dépendances et ferait exploser le budget de 5 minutes.
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: |
          git clean -ffdx -e /node_modules -e /dist -e /build
          # Un run précédent peut avoir modifié un fichier SUIVI (`npm install`
          # réécrit `package-lock.json`) : sans cette restauration, l'empreinte
          # comparée au marqueur n'est plus celle du commit et la CI réinstalle
          # à chaque run — donc dépasse le budget de 5 minutes.
          git checkout -- .

      # Le marqueur et le cache vivent HORS du workspace : un checkout frais
      # (branche spéculative de la file Mergify) vide le dossier de travail, ce
      # qui faisait repartir un `npm ci` de 5 min à chaque run — donc un job tué
      # par son propre `timeout-minutes: 5`. La restauration par liens durs
      # prend quelques secondes.
      - name: Dépendances (cache hors workspace, contrôle de complétude)
        shell: bash
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          export NPM_CONFIG_CACHE="$HOME/.npm-ci-cache"
          STATE="$HOME/.cache/rayon-impact-ci"
          KEY="$(printf '%s' "$PWD" | sha256sum | cut -c1-12)"
          mkdir -p "$STATE"
          MARKER="$STATE/$KEY.lock-hash"
          CACHE="$STATE/$KEY.node_modules"
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          MARKER_HASH="$(cat "$MARKER" 2>/dev/null || echo absent)"
          # Un `npm ci` tué par le budget laisse un node_modules PARTIEL : tester
          # seulement `-d node_modules` faisait sauter l'installation à tort, puis
          # échouer tsc (« Cannot find type definition file for 'node' »).
          complet() { [ -f "$1/.package-lock.json" ] && [ -d "$1/typescript" ] && [ -d "$1/@forge/api" ]; }
          etat() { if complet "$1"; then echo complet; elif [ -d "$1" ]; then echo partiel; else echo absent; fi; }
          echo "diag: cle=$KEY lock=${LOCK_HASH:0:12} marqueur=${MARKER_HASH:0:12} workspace=$(etat node_modules) cache=$([ -d "$CACHE" ] && etat "$CACHE" || echo absent)"
          if complet node_modules && [ "$LOCK_HASH" = "$MARKER_HASH" ]; then
            echo "node_modules complet et lock inchange - installation sautee"
          elif [ -d "$CACHE" ] && complet "$CACHE" && [ "$LOCK_HASH" = "$MARKER_HASH" ]; then
            # Incremental : `cp -aln` ne cree que les liens manquants. Un
            # `rm -rf` suivi d'une copie complete de 642 paquets prenait 4 min
            # sur un hote charge, soit tout le budget du job.
            mkdir -p node_modules
            cp -aln "$CACHE"/. node_modules/ 2>/dev/null || true
            echo "node_modules complete depuis le cache (liens durs, incremental)"
          else
            echo "installation des dependances..."
            npm ci --prefer-offline --no-audit --no-fund
            printf '%s' "$LOCK_HASH" > "$MARKER"
            rm -rf "$CACHE"
            cp -al node_modules "$CACHE" 2>/dev/null || true
          fi

      - name: Le TypeScript ou les dépendances ont-ils changé ?
        id: ts
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          git fetch -q --depth=50 origin "$BASE" 2>/dev/null || true
          if git diff --name-only "$BASE" HEAD 2>/dev/null \
             | grep -qE '\.(ts|tsx)$|package(-lock)?\.json$|tsconfig\.json$|vitest\.config\.ts$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "diag: typescript_modifie=$(cat "$GITHUB_OUTPUT" | tail -1)"

      - name: Types (tsc --noEmit)
        if: steps.ts.outputs.changed == 'true'
        run: npx tsc --noEmit

      - name: Tests unitaires (vitest)
        if: steps.ts.outputs.changed == 'true'
        run: npx vitest run --passWithNoTests

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import pathlib
          racines = [pathlib.Path(".")]
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for racine in racines:
              for f in sorted(racine.rglob("*")):
                  chemin = f.as_posix()
                  # node_modules et sorties de build : jamais des documents du depot.
                  if any(d in chemin for d in (".git/", "node_modules/", "/dist/", "/build/")):
                      continue
                  if f.suffix.lower() not in exts:
                      continue
                  total += 1
                  try:
                      contenu = f.read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      illisibles.append(f.as_posix())
                      continue
                  if not contenu.strip():
                      vides.append(f.as_posix())
          print("%d doc(s) controle(s)" % total)
          for f in illisibles:
                  print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
                  print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Vu en reel : l'agent de conflit a pousse une reconciliation partielle
      # (marqueur `>>>>>>>` + fichier tronque) sans qu'aucune porte ne le voie —
      # la porte de compilation ne s'applique qu'au code. Ce controle est donc
      # transversal : aucun fichier suivi ne doit contenir de marqueur de conflit.
      - name: Aucun marqueur de conflit dans les fichiers suivis
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======$)' -- . ':!*.md.orig'; then
            echo "::error::marqueur(s) de conflit trouves dans des fichiers suivis"
            exit 1
          fi
          echo "aucun marqueur de conflit"

      # Regles du projet : fichiers < 500 lignes, fonctions < 50 lignes.
      # Garde automatisee : jusque-la le controle etait fait a la main.
      - name: Tailles des fichiers et des fonctions
        run: python3 scripts/check-limits.py -q

      # Les gardes de la CI se testent elles-memes : couche0 + agents
      # fireworks - stdlib, quelques secondes, aucun reseau.
      - name: Tests des gardes CI (couche0, fireworks)
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
