name: CI

# CI de l'app Forge « Rayon d'impact » : types, tests unitaires, sanity docs et
# tests des gardes. Le check publié s'appelle `ci` : il est exigé par le
# ruleset de `main` et par la file Mergify, comme `ci-budget` et `couche0`.
#
# Budget : 5 minutes maximum (règle CI du 24 octobre). Les runners sont
# persistants : `node_modules` est conservé d'un run à l'autre, l'installation
# n'a lieu que si `package-lock.json` a changé. Le cache npm est partagé.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, rayon-impact-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : on garde `node_modules` (l'app
      # TypeScript), on jette le reste. `git clean -ffdx` sans `-e` effacerait
      # les dépendances et ferait exploser le budget de 5 minutes.
      - name: Nettoyage du workspace (node_modules conservé)
        shell: bash
        run: |
          git clean -ffdx -e /node_modules -e /.npm-state -e /dist -e /build
          # Un run précédent peut avoir modifié un fichier SUIVI (`npm install`
          # réécrit `package-lock.json`) : sans cette restauration, l'empreinte
          # comparée au marqueur n'est plus celle du commit et la CI réinstalle
          # à chaque run — donc dépasse le budget de 5 minutes.
          git checkout -- .

      - name: Dépendances (cache npm partagé, installation si le lock a changé)
        shell: bash
        run: |
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          export NPM_CONFIG_CACHE="$HOME/.npm-ci-cache"
          # Le marqueur vit HORS de node_modules : `npm ci` efface ce dossier.
          mkdir -p .npm-state
          MARKER=.npm-state/lock-hash
          LOCK_HASH="$(sha256sum package-lock.json | cut -d' ' -f1)"
          MARKER_HASH="$(cat "$MARKER" 2>/dev/null || echo absent)"
          MODULES="$([ -d node_modules ] && echo present || echo absent)"
          # Diagnostic : sans ces trois valeurs, un run lent est incompréhensible.
          echo "diag: pwd=$PWD lock=$LOCK_HASH marqueur=$MARKER_HASH node_modules=$MODULES"
          if [ "$MODULES" = "present" ] && [ "$LOCK_HASH" = "$MARKER_HASH" ]; then
            echo "node_modules deja a jour - installation sautee"
          else
            echo "installation des dependances..."
            npm ci --prefer-offline --no-audit --no-fund
            printf '%s' "$LOCK_HASH" > "$MARKER"
          fi

      - name: Types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Tests unitaires (vitest)
        run: npx vitest run --passWithNoTests

      - name: Sanity docs (UTF-8, non vides)
        run: |
          python3 - <<'EOF'
          import pathlib
          racines = [pathlib.Path(".")]
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          for racine in racines:
              for f in sorted(racine.rglob("*")):
                  chemin = f.as_posix()
                  # node_modules et sorties de build : jamais des documents du depot.
                  if any(d in chemin for d in (".git/", "node_modules/", "/dist/", "/build/")):
                      continue
                  if f.suffix.lower() not in exts:
                      continue
                  total += 1
                  try:
                      contenu = f.read_text(encoding="utf-8")
                  except (OSError, UnicodeError):
                      illisibles.append(f.as_posix())
                      continue
                  if not contenu.strip():
                      vides.append(f.as_posix())
          print("%d doc(s) controle(s)" % total)
          for f in illisibles:
                  print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
                  print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          EOF

      # Les gardes de la CI se testent elles-memes : couche0 + agents
      # fireworks - stdlib, quelques secondes, aucun reseau.
      - name: Tests des gardes CI (couche0, fireworks)
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py
